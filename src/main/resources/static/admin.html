<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 · Among the Stars</title>
<style>
  :root { --bg: #100d18; --card: #1b1626; --card-2: #221c2f; --line: #393044; --text: #faf6ff; --body: #d4cbd5; --muted: #b6aabd; --accent: #ff70cf; --accent-soft: rgba(255,112,207,.1); --danger: #ff8a8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--body); font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 24px; }
  h1 { color: var(--text); font-size: 24px; margin: 0; font-weight: 600; }
  h2 { color: var(--text); font-size: 17px; margin: 0 0 12px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input, select { background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  button { cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card-2); color: var(--text); padding: 8px 12px; font-size: 13px; }
  button.primary { background: var(--accent); color: #21132f; border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--card-2); border-radius: 10px; padding: 14px; }
  .stat b { display: block; color: var(--text); font-size: 22px; margin-top: 4px; }
  .stat span { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  td.msg { color: var(--text); white-space: pre-wrap; word-break: break-word; min-width: 260px; }
  tr.done td { opacity: .5; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .err { color: var(--danger); min-height: 1em; }
  .scroll { overflow-x: auto; }
  #app[hidden], #login[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <h1>🌙 Among the Stars 관리자</h1>
    <a href="/" class="muted" style="color:var(--muted)">사이트로 돌아가기</a>
  </div>

  <section class="card" id="login">
    <h2>관리자 확인</h2>
    <form class="row" id="login-form">
      <input type="password" id="key" placeholder="관리자 비밀번호 (ADMIN_PASSWORD)" autocomplete="current-password" style="flex:1;min-width:220px">
      <button class="primary" type="submit">들어가기</button>
    </form>
    <p class="err" id="login-err"></p>
    <p class="muted">비밀번호는 이 탭을 닫으면 사라져요. 10번 틀리면 15분 동안 잠겨요.</p>
  </section>

  <div id="app" hidden>
    <section class="card">
      <div class="row" style="justify-content:space-between"><h2>한눈에 보기</h2>
        <div class="row"><button id="refresh">새로고침</button><button id="logout">나가기</button></div></div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="card" style="margin-top:24px">
      <div class="row" style="justify-content:space-between"><h2>건의사항</h2>
        <select id="fb-filter"><option value="new">처리 안 한 것</option><option value="concern">고민 풀이가 안 맞아요</option><option value="all">전체</option></select></div>
      <div class="scroll"><table><thead><tr><th>날짜</th><th>종류</th><th>내용</th><th>화면</th><th>보낸 사람</th><th></th></tr></thead>
        <tbody id="fb-rows"></tbody></table></div>
    </section>

    <section class="card" style="margin-top:24px">
      <h2>회원</h2>
      <p class="muted">비밀번호는 암호화되어 저장돼서 관리자도 볼 수 없어요.</p>
      <div class="scroll"><table><thead><tr><th>아이디</th><th>가입일</th><th>마지막 로그인</th><th>상태</th><th></th></tr></thead>
        <tbody id="member-rows"></tbody></table></div>
    </section>
  </div>
</main>
<script src="/admin.js?v=1"></script>
</body>
</html>
