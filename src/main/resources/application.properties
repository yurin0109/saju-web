# ─────────────────────────────────────────────
# 기본 설정 = 로컬 실행용 (H2 파일 DB, 설치 없이 바로 실행)
# 배포할 때는 SPRING_PROFILES_ACTIVE=mysql 로 MySQL 사용
# ─────────────────────────────────────────────
spring.application.name=saju-web
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/saju;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# 엔티티 기준으로 테이블 자동 생성/수정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 웹 콘솔 (로컬에서 http://localhost:8080/h2-console)
spring.h2.console.enabled=true
# 콘솔은 내 PC(localhost)에서만 열린다. 다른 컴퓨터에서 접속 불가
spring.h2.console.settings.web-allow-others=false

# ── 보안 ──
# 에러가 나도 화면(응답)에 스택 · 예외 이름 · 내부 메시지를 보여주지 않는다
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
# 로그인 세션 쿠키: 자바스크립트로 못 읽게(HttpOnly), 다른 사이트에서 보낸 요청엔 안 붙게(SameSite=Lax)
server.servlet.session.cookie.name=ATS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d
server.servlet.session.tracking-modes=cookie
# https 로 배포하면 아래를 true 로 (쿠키를 https 에서만 보냄)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# 요청 헤더 크기 제한
server.max-http-request-header-size=16KB

spring.jackson.time-zone=Asia/Seoul

# ── 토스페이먼츠 결제 ──
# 키는 saju-web 폴더 바로 안의 toss.properties 파일(깃에 안 올라감)이나 환경변수로 넣는다.
# 둘 다 비어 있으면 모의 결제로 동작한다.
spring.config.import=optional:file:./toss.properties
toss.client-key=${TOSS_CLIENT_KEY:}
toss.secret-key=${TOSS_SECRET_KEY:}
